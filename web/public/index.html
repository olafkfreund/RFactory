<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RFactory · Standup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600..900&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">R</span>
    <span class="brand-name">RFactory</span>
  </div>
  <nav class="portal-switch" aria-label="Factory portals">
    <a class="portal-opt" href="https://cfactory.freundcloud.org.uk"><span class="portal-dot dot-c"></span>CFactory</a>
    <a class="portal-opt" href="https://pfactory.freundcloud.org.uk"><span class="portal-dot dot-p"></span>PFactory</a>
    <a class="portal-opt" href="https://aifactory.freundcloud.org.uk"><span class="portal-dot dot-ai"></span>AIFactory</a>
    <a class="portal-opt" href="https://tfactory.freundcloud.org.uk"><span class="portal-dot dot-t"></span>TFactory</a>
    <span class="portal-opt on" aria-current="page"><span class="portal-dot dot-r"></span>RFactory</span>
  </nav>
</header>

<main class="content">
  <div class="page-head">
    <div>
      <h1>Standup</h1>
      <p id="age">Loading the standup…</p>
    </div>
    <div class="head-actions">
      <span id="stale" class="status-pill warn" hidden><span class="dot"></span>stale data</span>
      <button id="run" class="btn" type="button">Refresh</button>
    </div>
  </div>

  <p id="status" class="status-line" role="status" aria-live="polite"></p>

  <div class="stats">
    <div class="stat stat--blocked"><span class="stat-label">Blocked</span><span id="blocked-count" class="stat-value">–</span></div>
    <div class="stat stat--in_progress"><span class="stat-label">In progress</span><span id="in_progress-count" class="stat-value">–</span></div>
    <div class="stat stat--left"><span class="stat-label">Left</span><span id="left-count" class="stat-value">–</span></div>
    <div class="stat stat--done"><span class="stat-label">Done</span><span id="done-count" class="stat-value">–</span></div>
  </div>

  <section id="summary-card" class="panel" hidden>
    <h2 class="panel-title">Summary</h2>
    <p id="summary" class="summary"></p>
    <p id="destination" class="fine"></p>
  </section>

  <section id="call" class="panel">
    <h2 class="panel-title">Call <span id="call-state" class="status-pill"><span class="dot"></span><span id="call-state-text">idle</span></span></h2>
    <div class="call-form">
      <input id="call-link" class="call-input" type="text" placeholder="https://meet.google.com/abc-defg-hij" autocomplete="off" aria-label="Meet link">
      <button id="call-join" class="btn" type="button">Join</button>
      <button id="call-leave" class="btn" type="button" disabled>Leave</button>
    </div>
    <p id="call-mic" class="fine"></p>
    <p id="call-voice" class="fine"></p>
    <p id="call-error" class="status-line" role="status" aria-live="polite"></p>
    <ul id="call-log" class="call-log"></ul>
  </section>

  <div class="board">
    <section id="blocked" class="col col--blocked"><h2 class="panel-title">Blocked</h2><ul></ul></section>
    <section id="in_progress" class="col col--in_progress"><h2 class="panel-title">In progress</h2><ul></ul></section>
    <section id="left" class="col col--left"><h2 class="panel-title">Left</h2><ul></ul></section>
    <section id="done" class="col col--done"><h2 class="panel-title">Done</h2><ul></ul></section>
  </div>

  <section id="unknown" class="panel panel--unknown"><h2 class="panel-title">Unrecognised states <span id="unknown-count" class="count">0</span></h2><ul></ul></section>
</main>
<script src="/app.js"></script>
</body>
</html>

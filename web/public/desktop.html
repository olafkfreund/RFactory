<!doctype html>
<html lang="en" data-portal="meet">
<head>
<meta charset="utf-8">
<title>RFactory · Desktop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/desktop.css">
</head>
<body>
<header class="f-topbar">
  <div class="f-topbar__left">
    <span class="f-brand"><span class="f-brand__mark" aria-hidden="true">R</span><span class="f-brand__name">RFactory</span></span>
    <nav class="f-portal-switcher" aria-label="Factory portals">
      <a class="f-portal-switcher__item" href="https://pfactory.freundcloud.org.uk" title="Plan"><span class="f-portal-switcher__dot f-portal-switcher__dot--plan" aria-hidden="true"></span><span class="f-portal-switcher__label">Plan</span></a>
      <a class="f-portal-switcher__item" href="https://aifactory.freundcloud.org.uk" title="Build"><span class="f-portal-switcher__dot f-portal-switcher__dot--build" aria-hidden="true"></span><span class="f-portal-switcher__label">Build</span></a>
      <a class="f-portal-switcher__item" href="https://tfactory.freundcloud.org.uk" title="Test"><span class="f-portal-switcher__dot f-portal-switcher__dot--test" aria-hidden="true"></span><span class="f-portal-switcher__label">Test</span></a>
      <a class="f-portal-switcher__item" href="https://cfactory.freundcloud.org.uk" title="Cockpit"><span class="f-portal-switcher__dot f-portal-switcher__dot--cockpit" aria-hidden="true"></span><span class="f-portal-switcher__label">Cockpit</span></a>
      <span class="f-portal-switcher__item" aria-current="page" title="Meet"><span class="f-portal-switcher__dot f-portal-switcher__dot--meet" aria-hidden="true"></span><span class="f-portal-switcher__label">Meet</span></span>
    </nav>
  </div>
  <div class="f-topbar__right">
    <div class="f-theme-switch" role="group" aria-label="Theme">
      <button class="f-theme-switch__opt" type="button" data-theme-choice="light" aria-pressed="false">Light</button>
      <button class="f-theme-switch__opt" type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      <button class="f-theme-switch__opt" type="button" data-theme-choice="system" aria-pressed="true">System</button>
    </div>
  </div>
</header>
<main class="content">
  <div class="page-head">
    <div>
      <h1>Desktop <span id="desktop-name"></span></h1>
      <p id="countdown" class="fine"></p>
    </div>
  </div>

  <p id="status" class="status-line" role="status" aria-live="polite"></p>
  <p id="alert" class="banner" role="alert" hidden></p>

  <section class="panel">
    <h2 class="panel-title">Live view <span id="live-status" class="fine"></span></h2>
    <div id="screen"></div>
  </section>

  <section class="panel">
    <h2 class="panel-title">Last screenshot</h2>
    <img id="shot" alt="Last screenshot taken by the agent (untrusted page content)" hidden>
  </section>

  <section class="panel">
    <h2 class="panel-title">Handover</h2>
    <p id="handover" class="fine">No handover.</p>
    <p id="running" class="fine"></p>
    <div id="controls" hidden>
      <label class="field">Actions (comma separated)
        <input id="actions" class="call-input" type="text" value="desktop_open,desktop_click,desktop_type,desktop_scroll,desktop_screenshot" autocomplete="off">
      </label>
      <label class="field">Hosts (origins, comma separated)
        <input id="hosts" class="call-input" type="text" placeholder="https://preview.example.com" autocomplete="off">
      </label>
      <label class="field">Minutes (1 to 30)
        <input id="minutes" class="call-input" type="number" min="1" max="30" value="10">
      </label>
      <button id="grant" class="btn" type="button">Grant</button>
      <button id="revoke" class="btn" type="button">Revoke</button>
    </div>
  </section>

  <section class="panel" id="request-panel" hidden>
    <h2 class="panel-title">Ask the agent</h2>
    <label class="field">Request
      <input id="request-text" class="call-input" type="text" maxlength="500" autocomplete="off">
    </label>
    <button id="request-send" class="btn" type="button">Send</button>
  </section>

  <section class="panel">
    <h2 class="panel-title">Share</h2>
    <p id="share" class="fine">Not sharing.</p>
    <button id="share-stop" class="btn" type="button" hidden>Stop</button>
  </section>

  <section class="panel">
    <h2 class="panel-title">Waiting for approval</h2>
    <ul id="queued" class="queue"></ul>
  </section>
  <section class="panel" id="profiles-panel" hidden>
    <h2 class="panel-title">Profiles (admin)</h2>
    <ul id="profiles" class="queue"></ul>
    <label class="field">New profile name
      <input id="profile-name" class="call-input" type="text" maxlength="100" autocomplete="off">
    </label>
    <button id="profile-create" class="btn" type="button">Create</button>
    <label class="field">Attach: call id
      <input id="profile-call" class="call-input" type="text" autocomplete="off">
    </label>
    <label class="field">Attach: platform (meet, zoom, slack)
      <input id="profile-platform" class="call-input" type="text" value="meet" autocomplete="off">
    </label>
  </section>
</main>
<script src="/desktop.js"></script>
</body>
</html>

# For the owner to add to factory-gitops (apps/rfactory-desktops/application.yaml).
# Not synced by itself: `exclude` keeps this file and namespace.yaml out of the
# synced set. The namespace is applied once by hand and never owned by the app
# (plan deviation 9). Deleting this Application removes the workloads, policies
# and StorageClass, never the namespace, PVCs or profile ConfigMaps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rfactory-desktops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/olafkfreund/RFactory
    # the feature branch while it is built (a push deploys); main once it merges
    targetRevision: main
    path: deploy/k8s/rfactory-desktops
    directory:
      exclude: "{namespace.yaml,application.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: rfactory-desktops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - RespectIgnoreDifferences=true

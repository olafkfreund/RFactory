# Three policies, each matching only the namespace rfactory-desktops, failurePolicy
# Fail. webhookConfiguration.matchConditions keeps the Fail webhook from touching
# any other namespace if Kyverno is down. Unverified against a live Kyverno until
# the first sync (see report): the CEL `cidr()` library and the foreach/regex.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: rfactory-no-protected-netpol
  annotations:
    policies.kyverno.io/description: >-
      No NetworkPolicy in rfactory-desktops may allow an always-protected range
      (node, pod and service networks, LAN, Tailscale, cloud metadata), except the
      runner ClusterIP /32, an except list that removes the range, or the named
      infrastructure policies in networkpolicies.yaml.
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  webhookConfiguration:
    matchConditions:
      - name: only-rfactory-desktops
        expression: "request.namespace == 'rfactory-desktops'"
  rules:
    - name: no-protected-range
      match:
        any:
          - resources:
              kinds: [NetworkPolicy]
              namespaces: [rfactory-desktops]
      validate:
        cel:
          variables:
            - name: protected
              expression: >-
                ['172.18.0.0/16', '10.42.0.0/16', '10.43.0.0/16', '192.168.0.0/16',
                 '100.64.0.0/10', '169.254.169.254/32', 'fd7a:115c:a1e0::/48', 'fe80::/10']
            - name: infra
              expression: >-
                ['rfactory-default-deny', 'rfactory-runner-guest-channels', 'rfactory-runner-api',
                 'rfactory-runner-egress-guard', 'rfactory-api-egress', 'rfactory-proxy-ingress',
                 'rfactory-proxy-egress-public']
            - name: infraOk
              expression: >-
                object.metadata.name in variables.infra &&
                request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller'
            - name: blocks
              expression: >-
                (has(object.spec.ingress) ? object.spec.ingress.map(r, has(r.from) ? r.from : []).flatten() : [])
                + (has(object.spec.egress) ? object.spec.egress.map(r, has(r.to) ? r.to : []).flatten() : [])
          expressions:
            - message: a NetworkPolicy may not allow an always-protected range
              expression: >-
                variables.infraOk ||
                variables.blocks.all(p, !has(p.ipBlock) || p.ipBlock.cidr == '10.43.250.10/32' ||
                  variables.protected.all(r,
                    !(cidr(p.ipBlock.cidr).containsCIDR(r) || cidr(r).containsCIDR(p.ipBlock.cidr)) ||
                    (has(p.ipBlock.except) && p.ipBlock.except.exists(e, cidr(e).containsCIDR(r)))))
            - message: every NetworkPolicy rule must name its peers by podSelector or ipBlock (no empty to/from, no namespaceSelector)
              expression: >-
                variables.infraOk ||
                ((!has(object.spec.egress) || object.spec.egress.all(r, has(r.to) && size(r.to) > 0 &&
                  r.to.all(p, !has(p.namespaceSelector)))) &&
                 (!has(object.spec.ingress) || object.spec.ingress.all(r, has(r.from) && size(r.from) > 0 &&
                  r.from.all(p, !has(p.namespaceSelector)))))
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: rfactory-no-host-privileged
  annotations:
    # Pods only: autogenerated controller rules would test spec.template, which has no ownerReferences.
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      No pod in rfactory-desktops may use hostNetwork or a privileged container,
      except the pods of the DaemonSet rfactory-guard.
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  webhookConfiguration:
    matchConditions:
      - name: only-rfactory-desktops
        expression: "request.namespace == 'rfactory-desktops'"
  rules:
    - name: no-host-network-or-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [rfactory-desktops]
      preconditions:
        all:
          - key: "{{ length(request.object.metadata.ownerReferences[?kind == 'DaemonSet' && name == 'rfactory-guard'] || `[]`) }}"
            operator: Equals
            value: 0
      validate:
        message: hostNetwork and privileged containers are allowed only for the rfactory-guard DaemonSet
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.hostNetwork || `false` }}"
                operator: Equals
                value: true
              - key: "{{ length(request.object.spec.containers[?securityContext.privileged == `true`] || `[]`) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(request.object.spec.initContainers[?securityContext.privileged == `true`] || `[]`) }}"
                operator: GreaterThan
                value: 0
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: rfactory-pinned-digests
  annotations:
    policies.kyverno.io/description: >-
      Every container image in rfactory-desktops must be pinned by sha256 digest
      (rfactory/<name>@sha256:REPLACE placeholders are refused until k10 records
      the real digests).
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  webhookConfiguration:
    matchConditions:
      - name: only-rfactory-desktops
        expression: "request.namespace == 'rfactory-desktops'"
  rules:
    - name: images-pinned-by-digest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [rfactory-desktops]
      validate:
        message: every image must end in @sha256:<64 hex>
        foreach:
          - list: "request.object.spec.containers"
            deny: &unpinned
              conditions:
                all:
                  - key: "{{ regex_match('@sha256:[0-9a-f]{64}$', '{{ element.image }}') }}"
                    operator: Equals
                    value: false
          - list: "request.object.spec.initContainers || `[]`"
            deny: *unpinned
          - list: "request.object.spec.ephemeralContainers || `[]`"
            deny: *unpinned

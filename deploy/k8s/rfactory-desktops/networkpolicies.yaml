# Runner egress for the STUN preflight of platforms with `stun` in desktop/ranges/ranges.json (Meet): UDP to
# those hosts and ports only. kyverno-scope.test.js fails when the two drift.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rfactory-runner-egress-media-stun, namespace: rfactory-desktops}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: rfactory-runner}}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 74.125.250.129/32}
      ports: [{protocol: UDP, port: 19302}]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rfactory-reaper
  namespace: rfactory-desktops
  labels: {app.kubernetes.io/name: rfactory-reaper}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rfactory-reaper}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rfactory-reaper
        rfactory.io/api-client: "true"
    spec:
      serviceAccountName: rfactory-reaper
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reaper
          image: rfactory/reaper@sha256:REPLACE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}

name: refresh-ranges

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node desktop/ranges/refresh.js
      - name: Open a PR when ranges changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- desktop/ranges/ranges.json; then exit 0; fi
          branch="chore/refresh-ranges-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(desktop): refresh media ranges"
          git push origin "$branch"
          gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
            --title "chore(desktop): refresh media ranges" \
            --body "Automated refresh of desktop/ranges/ranges.json. Review the diff against the platform's published list before merging."

name: Deploy (CD → ArgoCD)

# Continuous deployment for RFactory's two images (rfactory-web + rfactory-stt).
# On push to main: build+push immutable sha-tagged images to GHCR, scan, sign
# and attest, then bump the tags in factory-gitops so ArgoCD redeploys (#33).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/rfactory-web
  STT_IMAGE: ghcr.io/${{ github.repository_owner }}/rfactory-stt
  GITOPS_REPO: olafkfreund/factory-gitops
  GITOPS_PATH: apps/rfactory/manifests
  SIGNER_IDENTITY: '^https://github\.com/${{ github.repository_owner }}/RFactory/\.github/workflows/deploy\.yml@refs/heads/main$'

jobs:
  meta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  web:
    if: github.ref == 'refs/heads/main'
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build_web.outputs.digest }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push rfactory-web
        id: build_web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ needs.meta.outputs.tag }}
          # Google's apt repo keeps only the current Chrome, so a pinned version stops building;
          # an empty CHROME_VERSION installs the current one, and the signed digest pins the bytes.
          # (Chrome is unused in the cluster: calls run in the desktop VMs.)
          build-args: |
            RFACTORY_COMMIT=${{ github.sha }}
            CHROME_VERSION=
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install Trivy (P0 CVE gate)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0

      - name: Trivy binary is runnable
        run: trivy --version

      - name: Trivy scan rfactory-web image (fixable HIGH/CRITICAL)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${WEB_IMAGE}@${{ steps.build_web.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign rfactory-web (cosign keyless via Sigstore + GitHub OIDC)
        run: |
          cosign sign --yes "${WEB_IMAGE}@${{ steps.build_web.outputs.digest }}"

      - name: Verify signature (self-test)
        run: |
          cosign verify \
            --certificate-identity-regexp "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${WEB_IMAGE}@${{ steps.build_web.outputs.digest }}"

      - name: Assert signature is where Kyverno looks (Factory#804)
        run: |
          bash ./.github/scripts/assert-signature-location.sh "${WEB_IMAGE}" "${{ steps.build_web.outputs.digest }}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate + attest dual SBOMs (SPDX + CycloneDX)
        run: |
          REF="${WEB_IMAGE}@${{ steps.build_web.outputs.digest }}"
          syft scan "$REF" -o spdx-json=sbom-web.spdx.json
          syft scan "$REF" -o cyclonedx-json=sbom-web.cyclonedx.json
          cosign attest --yes --type spdxjson  --predicate sbom-web.spdx.json      "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom-web.cyclonedx.json "$REF"

      - name: Verify SBOM attestations (self-test)
        run: |
          REF="${WEB_IMAGE}@${{ steps.build_web.outputs.digest }}"
          for TYPE in spdxjson cyclonedx; do
            cosign verify-attestation --type "$TYPE" \
              --certificate-identity-regexp "${SIGNER_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$REF" > /dev/null
          done

      - name: Upload SBOMs as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rfactory-web-sboms-${{ needs.meta.outputs.tag }}
          path: sbom-web.*.json
          if-no-files-found: error

  stt:
    if: github.ref == 'refs/heads/main'
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build_stt.outputs.digest }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # trivy, cosign and syft read Docker's credential; skopeo falls back to it too
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push rfactory-stt
        id: build_stt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out="$(nix build .#image-stt --print-out-paths)"
          skopeo copy --digestfile digest "docker-archive:${out}" "docker://${STT_IMAGE}:${{ needs.meta.outputs.tag }}"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"

      - name: Install Trivy (P0 CVE gate)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0

      - name: Trivy binary is runnable
        run: trivy --version

      - name: Trivy scan rfactory-stt image (fixable HIGH/CRITICAL)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${STT_IMAGE}@${{ steps.build_stt.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign rfactory-stt (cosign keyless via Sigstore + GitHub OIDC)
        run: |
          cosign sign --yes "${STT_IMAGE}@${{ steps.build_stt.outputs.digest }}"

      - name: Verify signature (self-test)
        run: |
          cosign verify \
            --certificate-identity-regexp "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${STT_IMAGE}@${{ steps.build_stt.outputs.digest }}"

      - name: Assert signature is where Kyverno looks (Factory#804)
        run: |
          bash ./.github/scripts/assert-signature-location.sh "${STT_IMAGE}" "${{ steps.build_stt.outputs.digest }}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate + attest dual SBOMs (SPDX + CycloneDX)
        run: |
          REF="${STT_IMAGE}@${{ steps.build_stt.outputs.digest }}"
          syft scan "$REF" -o spdx-json=sbom-stt.spdx.json
          syft scan "$REF" -o cyclonedx-json=sbom-stt.cyclonedx.json
          cosign attest --yes --type spdxjson  --predicate sbom-stt.spdx.json      "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom-stt.cyclonedx.json "$REF"

      - name: Verify SBOM attestations (self-test)
        run: |
          REF="${STT_IMAGE}@${{ steps.build_stt.outputs.digest }}"
          for TYPE in spdxjson cyclonedx; do
            cosign verify-attestation --type "$TYPE" \
              --certificate-identity-regexp "${SIGNER_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$REF" > /dev/null
          done

      - name: Upload SBOMs as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rfactory-stt-sboms-${{ needs.meta.outputs.tag }}
          path: sbom-stt.*.json
          if-no-files-found: error

  promote:
    if: github.ref == 'refs/heads/main'
    needs: [meta, web, stt]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
    steps:
      - name: Note if GITOPS_PAT is unset
        if: ${{ env.GITOPS_PAT == '' }}
        run: echo "::notice::Images pushed. Set GITOPS_PAT to auto-bump factory-gitops; until then bump apps/rfactory/manifests/kustomization.yaml manually."

      - name: Bump factory-gitops
        if: ${{ env.GITOPS_PAT != '' }}
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          WEB_REF="${WEB_IMAGE}:${TAG}@${{ needs.web.outputs.digest }}"
          STT_REF="${STT_IMAGE}:${TAG}@${{ needs.stt.outputs.digest }}"
          # a rerun of an older run must not roll the deployment back
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::${GITHUB_SHA} is no longer the head of main (${head}); not promoting."
            exit 0
          fi
          # each image's pin, read from the named images entry, not a shared grep
          pinned() {
            [ "$(yq ".images[] | select(.name == \"$1\") | .newTag + \"@\" + .digest" "$3/kustomization.yaml")" = "${TAG}@$2" ]
          }

          pushed=""
          for attempt in 1 2 3 4 5; do
            rm -rf gitops
            git clone --quiet --depth 1 "https://x:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" gitops
            if [ ! -f "gitops/${GITOPS_PATH}/kustomization.yaml" ]; then
              echo "::notice::${GITOPS_PATH}/kustomization.yaml does not exist yet in ${GITOPS_REPO}; skipping promotion."
              exit 0
            fi
            cd "gitops/${GITOPS_PATH}"
            # this job holds GITOPS_PAT: the tool is checked against the release's published sha256
            curl -sSLo kustomize.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
            echo "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7  kustomize.tgz" | sha256sum -c --quiet
            tar xzf kustomize.tgz kustomize && rm -f kustomize.tgz
            ./kustomize edit set image "${WEB_IMAGE}=${WEB_REF}"
            ./kustomize edit set image "${STT_IMAGE}=${STT_REF}"
            rm -f kustomize
            cd "$GITHUB_WORKSPACE/gitops"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if git diff --quiet; then
              if pinned "$WEB_IMAGE" "${{ needs.web.outputs.digest }}" "$GITOPS_PATH" \
                 && pinned "$STT_IMAGE" "${{ needs.stt.outputs.digest }}" "$GITOPS_PATH"; then
                echo "gitops already pinned to ${TAG}; nothing to do."
                pushed="already"
                break
              fi
              echo "::error::the image edit changed nothing AND the pins are not both ${TAG}."
              echo "::error::The kustomize pattern no longer matches this manifest."
              exit 1
            fi

            git commit --quiet -am "cd(rfactory): ${TAG} [skip ci]"
            if git push --quiet; then
              pushed="yes"
              break
            fi
            echo "push rejected (attempt ${attempt}/5) - another service bumped first; retrying"
            cd "$GITHUB_WORKSPACE"
            sleep $(( attempt * 3 ))
          done

          if [ -z "$pushed" ]; then
            echo "::error::could not push the image bump after 5 attempts (Factory#527)."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          rm -rf gitops-verify
          git clone --quiet --depth 1 "https://x:${GITOPS_PAT}@github.com/${GITOPS_REPO}.git" gitops-verify
          if pinned "$WEB_IMAGE" "${{ needs.web.outputs.digest }}" "gitops-verify/${GITOPS_PATH}" \
             && pinned "$STT_IMAGE" "${{ needs.stt.outputs.digest }}" "gitops-verify/${GITOPS_PATH}"; then
            echo "verified: ${GITOPS_REPO} pins both images at ${TAG}"
          else
            echo "::error::pushed, but ${GITOPS_REPO} does not pin both images at ${TAG}."
            exit 1
          fi
